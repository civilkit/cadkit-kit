[package]
name = "civilkit-cad"
version = "0.6.1"
description = "CivilKit CAD desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

# own workspace: the desktop shell is built separately from the web app
[workspace]

[lib]
name = "civilkit_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
