[book]
title = "CivilKit CAD user guide"
description = "How to model, import, export and check parts in CivilKit CAD."
authors = ["The CivilKit authors"]
language = "en"
src = "src"

[build]
build-dir = "../dist-guide"
create-missing = false

[output.html]
site-url = "/docs/cad/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["civilkit.css"]
additional-js = ["civilkit-nav.js"]

[output.html.search]
enable = true
limit-results = 20
