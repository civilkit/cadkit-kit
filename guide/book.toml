[book]
title = "CadKit user guide"
description = "How to model, import, export and check parts in CadKit."
authors = ["The CadKit authors"]
language = "en"
src = "src"

[build]
build-dir = "../dist-guide"
create-missing = false

[output.html]
site-url = "/docs/cad/"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 20
